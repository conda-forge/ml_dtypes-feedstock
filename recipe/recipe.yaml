schema_version: 1

context:
  name: ml_dtypes
  version: "0.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ml_dtypes-${{ version }}.tar.gz
  sha256: 67fd890fb09d1e068cfe1b4dc8e204430ae7632102b4a4f854b093b6f02b3950

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
        - numpy
    - if: linux
      then:
        - make
    - cmake
  host:
    - python
    - numpy
    - pip
    - scikit-build-core
  run:
    - python

tests:
  - python:
      imports:
        - ml_dtypes

about:
  summary: A stand-alone implementation of several NumPy dtype extensions used in machine learning
  license: MPL-2.0 AND Apache-2.0
  license_file:
    - LICENSE.eigen
    - LICENSE
  homepage: https://pypi.org/project/ml-dtypes/
  repository: https://github.com/jax-ml/ml_dtypes
  documentation: https://github.com/jax-ml/ml_dtypes

extra:
  recipe-maintainers:
    - ngam
    - xhochy
